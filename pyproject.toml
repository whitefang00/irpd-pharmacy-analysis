[project]
name = "irpd"
version = "0.1.0"
description = "An AI analyst for a real retail pharmacy's sales and stock"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "fastapi>=0.162.0",
    "openai>=3.41.0",
    "pandas>=2.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
irpd = "irpd.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/irpd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["data: needs the real IRPD files in data/raw/irpd (skipped otherwise)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
